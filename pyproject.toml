[project]
name = "dayoptimizer"
version = "0.1.0"
description = "Deterministic day planner for Apple Calendar with optional Garmin health data — packaged as a Claude Code plugin"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "fidok" }]
requires-python = ">=3.13"
dependencies = [
    "garminconnect>=0.2.19",
    "pyobjc-framework-EventKit>=11.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "anthropic>=0.90.0",
    "mcp>=1.2",
    "recurring-ical-events>=3.8.2",
    "babel>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[project.scripts]
dayoptimizer = "dayoptimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dayoptimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# real bugs and dead code first; style is the code's own (one-line helpers, long docstrings)
select = ["F", "E9", "B", "I", "UP", "RUF100"]
ignore = [
    "B008",
    "B023",  # closures in loops here run within their own iteration (sort keys, local helpers)
]
