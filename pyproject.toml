[project]
name = "dayoptimizer"
version = "0.1.0"
description = "Deterministic day planner for Apple Calendar with optional Garmin health data — packaged as a Claude Code plugin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "garminconnect>=0.2.19",
    "pyobjc-framework-EventKit>=11.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "anthropic>=0.90.0",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
dayoptimizer = "dayoptimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dayoptimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
