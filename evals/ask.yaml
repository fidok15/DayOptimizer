# What the user types -> the events and tasks DayOptimizer understands.
# scripts/eval_ask.py --backend ollama
# Every case is said in Polish and in English; both must give the same result.
# The routine and categories are those of evals/days.yaml, plus the ones below.
# now: Monday 2030-10-14 09:00. Days: Mon 14 ... Sun 20, next week Mon 21 ...
# Expectations:
#   events: title (any of these stems in the title, lower case), day, start, end, category (optional;
#           a list = any of them, where more than one fits)
#   tasks: title, minutes, category, priority, chunk, due / not_before ("YYYY-MM-DD" = that day,
#          "YYYY-MM-DD HH:MM" = exactly; null = none)
#   skip: {day: [routine block labels left out that day]}
# Anything not listed must not be there: no extra events or tasks.
now: "2030-10-14 09:00"
extra_categories: [Personal, Uni]
cases:
  - name: dentist-then-work
    pl: "jutro dentysta o 10 na pół godziny, potem praca do 17"
    en: "tomorrow dentist at 10 for half an hour, then work until 17"
    events:
      - {title: [dent], day: 2030-10-15, start: "10:00", end: "10:30", category: Personal}
      - {title: [prac, work], day: 2030-10-15, start: "10:30", end: "17:00", category: Work}
  - name: twelve-hour-clock
    pl: "spotkanie z Anią o 14:30 na godzinę"
    en: "meeting with Anna at 2:30pm for an hour"
    events:
      - {title: [ani, anna], day: 2030-10-14, start: "14:30", end: "15:30"}
  - name: deadline-task
    pl: "raport na piątek, 3h, pilne"
    en: "report for Friday, 3 hours, urgent"
    tasks:
      - {title: [rap, rep], minutes: 180, due: 2030-10-18, not_before: null, category: [Work, Learn, Uni], priority: high}
  - name: afternoon-chore
    pl: "po południu zrób pranie, godzina"
